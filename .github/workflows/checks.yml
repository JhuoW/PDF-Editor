name: Editor checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pin the OS supported by the Playwright version in package-lock.json.
  # ubuntu-latest can advance before that browser release supports the new OS.
  # Preserve the existing required check name for branch protection.
  check:
    needs: [quality, browser, deployment]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all checks to pass
        env:
          CHECK_RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$CHECK_RESULTS" = "success,success,success"

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npm run check:i18n
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2 --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: browser-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        id: install_browser
      - run: npx playwright test --config tests/fixtures/deployment.playwright.config.ts --workers=2 --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: deployment-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - run: npx playwright test --config tests/fixtures/secure-redaction.playwright.config.ts
        if: ${{ !cancelled() && matrix.shard == 1 && steps.install_browser.outcome == 'success' }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && matrix.shard == 1 }}
        with:
          name: secure-redaction-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
